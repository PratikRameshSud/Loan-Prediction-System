<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Prediction System - Create Account</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="portal-card">
            
            <!-- Left Side Branding Panel -->
            <div class="branding-panel">
                <div class="overlay"></div>
                <div class="branding-content">
                    <i class="fas fa-user-plus main-icon"></i>
                    <h1 class="brand-title">Register<span class="dot">.</span></h1>
                    <p class="brand-tagline">Set up your profile to start checking or verifying loan applications instantly.</p>
                </div>
            </div>

            <!-- Right Side Form Panel -->
            <div class="form-panel scrolling-panel">
                <div class="form-header">
                    <h2>Create Account</h2>
                    <p class="subtitle">Join as a Customer or Loan Officer</p>
                </div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-name"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="reg-name" name="fullname" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="reg-email" name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-phone"><i class="fas fa-phone"></i> Mobile Number</label>
                        <input type="tel" id="reg-phone" name="phone" placeholder="10-digit mobile number" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="reg-password" name="password" placeholder="Minimum 8 characters" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-role"><i class="fas fa-users-cog"></i> Account Type</label>
                        <select id="reg-role" name="role" required>
                            <option value="customer">Customer (Borrower)</option>
                            <option value="officer">Loan Officer (Bank Staff)</option>
                        </select>
                    </div>

                    <!-- Customer Only Block -->
                    <div id="customer-parameters">
                        <div class="form-group">
                            <label for="reg-income"><i class="fas fa-wallet"></i> Annual Income (₹)</label>
                            <input type="number" id="reg-income" name="income" placeholder="e.g., 50000">
                        </div>
                        
                        <div class="form-group">
                            <label for="reg-credit"><i class="fas fa-star"></i> Credit Score</label>
                            <input type="number" id="reg-credit" name="credit_score" placeholder="e.g., 750" min="300" max="850">
                        </div>
                    </div>

                    <!-- Officer Only Block -->
                    <div class="form-group security-field" id="bank-number-group">
                        <label for="reg-bank-no" class="highlight-label"><i class="fas fa-shield-alt"></i> Secret Bank Number</label>
                        <input type="password" id="reg-bank-no" name="bank_number" placeholder="Enter bank authorization code">
                        <small class="help-text">Required to prevent unauthorized access to officer dashboard.</small>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-block effect-ripple">
                        Register Account <i class="fas fa-check-circle"></i>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Already have an account? <a href="login.html" class="switch-link">Sign In here</a></p>
                </div>

                <!-- Inline feedback message -->
                <div id="reg-alert" style="display:none; margin-top:16px; padding:12px 16px; border-radius:8px; font-size:14px; font-weight:600;"></div>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Derive API base from current URL dynamically
        const API_BASE = window.location.origin + window.location.pathname.replace(/\/frontend\/.*$/, '') + '/backend/api';
        let csrfToken = '';

        document.addEventListener('DOMContentLoaded', function () {

            // Dynamic Form Field Toggle Controls
            const roleSelect = document.getElementById('reg-role');
            const customerFields = document.getElementById('customer-parameters');
            const bankGroup = document.getElementById('bank-number-group');
            const incomeInput = document.getElementById('reg-income');
            const creditInput = document.getElementById('reg-credit');
            const bankInput = document.getElementById('reg-bank-no');

            function handleRoleToggle() {
                if (roleSelect.value === 'customer') {
                    customerFields.style.display = 'block';
                    bankGroup.style.display = 'none';
                    incomeInput.required = true;
                    creditInput.required = true;
                    bankInput.required = false;
                } else {
                    customerFields.style.display = 'none';
                    bankGroup.style.display = 'block';
                    incomeInput.required = false;
                    creditInput.required = false;
                    bankInput.required = true;
                }
            }

            roleSelect.addEventListener('change', handleRoleToggle);
            handleRoleToggle(); // Trigger initial execution state immediately

            // Fetch CSRF token on load
            (async () => {
                try {
                    const res  = await fetch(API_BASE + '/auth/csrf.php', { credentials: 'include' });
                    const data = await res.json();
                    if (data.success) csrfToken = data.data.csrf_token;
                } catch (_) {}
            })();

            function showAlert(msg, success) {
                const el = document.getElementById('reg-alert');
                el.textContent   = msg;
                el.style.display = 'block';
                el.style.background = success ? '#f0fdf4' : '#fef2f2';
                el.style.color      = success ? '#166534' : '#991b1b';
                el.style.border     = '1px solid ' + (success ? '#bbf7d0' : '#fca5a5');
            }

            document.getElementById('register-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                e.stopPropagation();

                const btn = this.querySelector('button[type=submit]');
                btn.disabled    = true;
                btn.textContent = 'Creating Account…';

                const payload = {
                    fullname:     document.getElementById('reg-name').value.trim(),
                    email:        document.getElementById('reg-email').value.trim(),
                    phone:        document.getElementById('reg-phone').value.trim(),
                    password:     document.getElementById('reg-password').value,
                    role:         document.getElementById('reg-role').value,
                    income:       document.getElementById('reg-income').value || null,
                    credit_score: document.getElementById('reg-credit').value || null,
                    bank_number:  document.getElementById('reg-bank-no').value || '',
                    csrf_token:   csrfToken,
                };

                try {
                    const res  = await fetch(API_BASE + '/auth/register.php', {
                        method:      'POST',
                        credentials: 'include',
                        headers:     { 'Content-Type': 'application/json' },
                        body:        JSON.stringify(payload),
                    });
                    const data = await res.json();

                    if (data.success) {
                        showAlert('Account created! Redirecting to login…', true);
                        setTimeout(() => window.location.href = 'login.html', 1800);
                    } else {
                        showAlert(data.message || 'Registration failed.', false);
                    }
                } catch (err) {
                    showAlert('Network error: ' + err.message, false);
                } finally {
                    btn.disabled  = false;
                    btn.innerHTML = 'Register Account <i class="fas fa-check-circle"></i>';
                }
            });

        });
    </script>
</body>
</html>
