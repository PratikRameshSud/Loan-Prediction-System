<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login - Banking Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2e3bad;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin-bottom: 6px;
            color: #0f172a;
            font-weight: 700;
        }
        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }
        .form-group input, .form-group select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }
        .btn-login {
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #1e2896;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Access your secure credit lending space.</p>
        
        <div class="error-msg" id="errorMessage">Invalid credentials provided.</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Portal Assignment (Role)</label>
                <select id="role">
                    <option value="customer">Customer Portfolio</option>
                    <option value="officer">Loan Underwriting Officer</option>
                </select>
            </div>
            <button type="submit" class="btn-login">Authenticate Securely</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748b;">
            Don't have an account? <a href="register.html" style="color: #2e3bad; font-weight: 700; text-decoration: none;">Create one here</a>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Derive API base dynamically based on standard folder layout
        const API_BASE = window.location.origin + window.location.pathname.replace(/\/frontend\/.*$/, '') + '/backend/api';
        const loginForm = document.getElementById('loginForm');
        const errorDiv  = document.getElementById('errorMessage');
        const submitBtn = loginForm.querySelector('button[type=submit]');
        let csrfToken   = '';

        // ── Fetch CSRF token on load ──────────────────────────────────
        (async () => {
            try {
                const res  = await fetch(API_BASE + '/auth/csrf.php', { credentials: 'include' });
                const data = await res.json();
                if (data.success) csrfToken = data.data.csrf_token;
            } catch (_) {}
        })();

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            e.stopPropagation();
            errorDiv.style.display = 'none';
            submitBtn.textContent  = 'Authenticating…';
            submitBtn.disabled     = true;

            const payload = {
                email:      document.getElementById('email').value.trim(),
                password:   document.getElementById('password').value,
                role:       document.getElementById('role').value,
                csrf_token: csrfToken,
            };

            try {
                const res  = await fetch(API_BASE + '/auth/login.php', {
                    method:      'POST',
                    credentials: 'include',
                    headers:     { 'Content-Type': 'application/json' },
                    body:        JSON.stringify(payload),
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.data.redirect;
                } else {
                    errorDiv.textContent   = data.message || 'Invalid credentials.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent   = 'Network error: ' + err.message;
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.textContent = 'Authenticate Securely';
                submitBtn.disabled    = false;
            }
        });
    });
</script>
</body>
</html>
