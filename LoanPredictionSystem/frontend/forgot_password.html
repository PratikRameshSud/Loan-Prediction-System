<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Prediction System - Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="portal-card">
            
            <!-- Left Side Branding Panel (Matches Login/Register using your home.png image) -->
            <div class="branding-panel">
                <div class="overlay"></div>
                <div class="branding-content">
                    <i class="fas fa-key main-icon"></i>
                    <h1 class="brand-title">Reset Access<span class="dot">.</span></h1>
                    <p class="brand-tagline">Don't worry, it happens. Provide your registered email address to recover your account credentials securely.</p>
                </div>
            </div>

            <!-- Right Side Form Panel -->
            <div class="form-panel">
                <div class="form-header">
                    <h2>Forgot Password?</h2>
                    <p class="subtitle">Enter your email below to receive a password reset link.</p>
                </div>

                <form id="forgot-form">
                    <div class="form-group">
                        <label for="forgot-email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="forgot-email" name="email" placeholder="name@example.com" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block effect-ripple">
                        Send Reset Link <i class="fas fa-paper-plane"></i>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Remembered your password? <a href="login.html" class="switch-link">Back to Sign In</a></p>
                </div>

                <div id="forgot-alert" style="display:none; margin-top:16px; padding:12px 16px; border-radius:8px; font-size:14px; font-weight:600;"></div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const API_BASE = window.location.origin + window.location.pathname.replace(/\/frontend\/.*$/, '') + '/backend/api';
            let csrfToken = '';

            (async () => {
                try {
                    const res  = await fetch(API_BASE + '/auth/csrf.php', { credentials: 'include' });
                    const data = await res.json();
                    if (data.success) csrfToken = data.data.csrf_token;
                } catch (_) {}
            })();

            document.getElementById('forgot-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                e.stopPropagation();
                const btn     = this.querySelector('button[type=submit]');
                const alertEl = document.getElementById('forgot-alert');
                btn.disabled    = true;
                btn.textContent = 'Sending…';

                try {
                    const res  = await fetch(API_BASE + '/auth/forgot_password.php', {
                        method:      'POST',
                        credentials: 'include',
                        headers:     { 'Content-Type': 'application/json' },
                        body:        JSON.stringify({
                            email:      document.getElementById('forgot-email').value.trim(),
                            csrf_token: csrfToken,
                        }),
                    });
                    const data = await res.json();

                    alertEl.textContent   = data.message;
                    alertEl.style.display = 'block';
                    alertEl.style.background = data.success ? '#f0fdf4' : '#fef2f2';
                    alertEl.style.color      = data.success ? '#166534' : '#991b1b';
                    alertEl.style.border     = '1px solid ' + (data.success ? '#bbf7d0' : '#fca5a5');

                    if (data.success && data.data && data.data.reset_url) {
                        alertEl.innerHTML += '<br><small>Dev link: <a href="' + data.data.reset_url + '">' + data.data.reset_url + '</a></small>';
                    }
                } catch (err) {
                    alertEl.textContent   = 'Network error: ' + err.message;
                    alertEl.style.display = 'block';
                } finally {
                    btn.disabled  = false;
                    btn.innerHTML = 'Send Reset Link <i class="fas fa-paper-plane"></i>';
                }
            });
        });
    </script>

</body>
</html>
